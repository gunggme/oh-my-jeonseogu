name: npm publish

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate without publishing to npm
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'gunggme/oh-my-jeonseogu' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Plan idempotent release
        id: release
        run: node .github/scripts/release-plan.mjs
      - name: Build release archive
        run: npm pack
      - name: Verify publish payload without uploading
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "oh-my-jeonseogu-$VERSION.tgz" --dry-run --ignore-scripts
      - name: Publish with npm trusted publishing
        if: >-
          steps.release.outputs.publish == 'true' &&
          vars.NPM_PUBLISH_ENABLED == 'true' &&
          !github.event.repository.private &&
          (github.event_name == 'push' || !inputs.dry_run)
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "oh-my-jeonseogu-$VERSION.tgz" --ignore-scripts --provenance --access public
      - name: Summarize release state
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NEW_VERSION: ${{ steps.release.outputs.publish }}
          ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          PRIVATE: ${{ github.event.repository.private }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          {
            echo "Version: $VERSION"
            echo "New version: $NEW_VERSION"
            echo "Publishing enabled: ${ENABLED:-false}"
            echo "Repository private: $PRIVATE"
            echo "Explicit dry run: $DRY_RUN"
            echo "Publication requires a public repository, NPM_PUBLISH_ENABLED=true, and npm trusted publishing."
          } >> "$GITHUB_STEP_SUMMARY"
